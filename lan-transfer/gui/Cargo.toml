[package]
name = "lan-gui"
version = "0.2.1"
edition = "2021"

# 生成的可执行文件直接叫 lanchat(.exe)，和托盘程序默认找的文件名一致
[[bin]]
name = "lanchat"
path = "src/main.rs"

[dependencies]
lan-core = { path = "../core" }
eframe = "0.29"
# eframe = {
#    version = "0.29",
#    features = ["glow", "wgpu"]
# }
raw-window-handle = "0.6"

[features]
# 把 gui/assets/font.ttf 编进可执行文件（真正零外部字体依赖）。
# 需要你自己放一个中文字体文件（.ttf/.otf/.ttc 均可，改名为 font.ttf）。
embed-font = []

[patch.crates-io]
egui-winit = { path = "patches/egui-winit" }